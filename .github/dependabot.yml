# Dependabot, from Git Crafter templates/ci/dependabot.yml at v7.0.2.
#
# One weekly pull request bumps every pinned action, Git Crafter's CI standard
# included. A new release waits 14 days first (the dependabot_cooldown ideal).
# Pinning by SHA is right for supply-chain safety, but a pinned SHA never
# updates itself; this file is what keeps the pins current.
#
# The doctrine tooling in 04_tools/ is standard library by design, so there is
# no pip entry. The npm entry covers the site workspace (site/), resolved from
# the root package-lock.json. Minor and patch updates come grouped; a major
# update (TypeScript 6 to 7, say) comes alone, so its own CI run judges it.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels:
      - "tooling"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      site:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    labels:
      - "tooling"
