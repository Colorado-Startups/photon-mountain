name: voice-check

# The deterministic voice gate on the prose changed in a pull request.
#
# It runs the SAME script the local Claude Code harness and .githooks/pre-commit
# run (.claude/hooks/pm-check-voice.sh), rather than reimplementing the check in
# YAML. That is the point: the gate has one definition and three call sites, so
# it cannot drift between a laptop, a web edit, and a cloud agent. No AI, no
# paid dependency, no network.
#
# REQUIRED on every pull request (repo ruleset "Required checks", 2026-11-12).
# It fails only when the lint assigns a FAIL, which today means an em dash or a
# spaced en dash: literal tests with no false positives. Warnings print and
# pass. A lint crash maps to 0 inside the hook, so the gate fails open on
# infrastructure and never on a broken checker.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-check:
    name: voice-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the diff against the PR base resolves

      - name: Voice gate on changed prose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          HOOK=".claude/hooks/pm-check-voice.sh"
          if [ ! -r "$HOOK" ]; then
            echo "Voice hook not found; nothing to check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "${BASE_SHA:-}" ]; then
            range="$BASE_SHA HEAD"
          else
            range="HEAD~1 HEAD"
          fi

          changed="$(git diff --name-only --diff-filter=ACM $range \
            | grep -iE '\.(md|mdx|txt)$' || true)"

          if [ -z "$changed" ]; then
            echo "No changed prose files in this pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Voice gate"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Exit 1 means at least one FAIL finding. The hook normalizes it, so
          # a crash in the lint never reads as one. Route on the code, not on
          # check names: the lint owns the grades.
          status=0
          out="$(bash "$HOOK" $changed 2>&1)" || status=$?

          if [ -z "$out" ]; then
            echo "Clean. No findings on the changed prose." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -eq 1 ]; then
            {
              echo
              echo 'A FAIL finding reached a pull request. The local hook blocks these,'
              echo 'so either it is not enabled in that clone or the commit bypassed'
              echo 'it. Enable it with: `git config core.hooksPath .githooks`'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          printf '%s\n' "$out"
          if [ "$status" -eq 1 ]; then
            echo "voice-check: a FAIL finding blocks this pull request; details are in the job summary."
            exit 1
          fi
          echo "voice-check: warnings only, advisory; details are in the job summary."
