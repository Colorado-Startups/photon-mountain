name: secret-scan

# Secret scanning with the gitleaks BINARY, deliberately not gitleaks-action.
#
# The Action wrapper requires a license key for organization-owned repositories
# ("If you are scanning repos that belong to an organization account, you will
# need to obtain a free license key"). This repository is organization-owned,
# so the Action would fail on the first run. The scanner itself is MIT with no
# such gate, so the binary is downloaded and run directly. No signup, no
# secret to manage.
#
# GitHub's own secret scanning is free on public repositories, not private
# ones at the Free tier, so it turns on at PT-9 and this workflow becomes the
# second line rather than the only one.
#
# It scans every commit (gitleaks git), so a credential that a later commit
# removed still fails. The tarball is pinned by version and by the SHA-256
# from that release's gitleaks_8.30.1_checksums.txt (read 2026-11-02).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 * * 1' # Mondays, 15:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so every commit is scanned
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        run: |
          set -uo pipefail
          if gitleaks git . --no-banner --redact=100 --verbose --report-format sarif \
               --report-path /tmp/gitleaks.sarif; then
            echo "No secrets found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Possible secret found"
            echo
            echo "gitleaks flagged something. Values are redacted in the log."
            echo "Do not push further until you have confirmed whether it is a"
            echo "real credential. If it is real: remove it, rotate it, and"
            echo "treat the history as compromised."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
