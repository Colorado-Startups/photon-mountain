name: gate-selftests

# The gates check themselves.
#
# A gate that does not pass its own self-test cannot be trusted to check
# anything else, so this workflow is meant to be BLOCKING once required checks
# are available, unlike the advisory content checks.
#
# brand_tokens --self-test is the one worth understanding: it re-reads the
# token block out of 01_doctrine/brand_identity.md and fails if the code and
# the doctrine have drifted apart. It also re-derives every contrast ratio the
# identity document states, and asserts that the accessibility gate still
# rejects a known-bad pairing. That makes palette drift a test failure instead
# of a silent, unreadable render.
#
# The three Python scripts are standard library only, by design, so there is
# nothing to install and this job stays fast. The shell gates need only bash,
# git and that same python3.

on:
  push:
    paths:
      - '04_tools/**'
      - '01_doctrine/brand_identity.md'
      - '01_doctrine/brand_assets/fonts/**'
      - '.claude/hooks/**'
      - '.githooks/**'
      - '.github/workflows/gate-selftests.yml'
  pull_request:
    paths:
      - '04_tools/**'
      - '01_doctrine/brand_identity.md'
      - '01_doctrine/brand_assets/fonts/**'
      - '.claude/hooks/**'
      - '.githooks/**'
      - '.github/workflows/gate-selftests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-selftests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftests:
    name: gate self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: voice_lint.py
        run: python3 04_tools/voice_lint.py --self-test

      - name: brand_tokens.py
        run: python3 04_tools/brand_tokens.py --self-test

      - name: marker_parity.py
        run: python3 04_tools/marker_parity.py --self-test

      # The shared voice gate is a gate too, and it owns the exempt list. Its
      # self-test asserts that every exempt pattern still matches a real file,
      # so a renamed path cannot leave a dead exemption behind.
      - name: pm-check-voice.sh
        run: bash .claude/hooks/pm-check-voice.sh --self-test

      # The bypass guard is a gate too. Its test used to live in a scratch
      # directory, which is session-scoped, so it evaporated and left the gate
      # untested. It ships with the hook now.
      - name: pm-guard-bypass.sh
        run: bash .claude/hooks/pm-guard-bypass.sh --self-test

      # The pre-commit hook is the only gate that blocks anything while the
      # repo is private. Its self-test commits seeded files in throwaway
      # repositories, through copies of the hook, pm-check-voice.sh and the
      # lint, and checks what blocks, what warns and proceeds, and what passes.
      - name: .githooks/pre-commit
        run: bash .githooks/pre-commit --self-test
