name: cloud-test

# ADVISORY. No ruleset requires this check, so it reports and never blocks a merge.
#
# Runs a name from .github/cloud-test.json on a hosted runner through the shared workflow in Colorado-Startups/.github
# (cloud-test/README.md there). Cloud first, the Mac last and small (Paul, 2026-11-02): suites, builds, browsers
# and renders run here, so a session dispatches them instead:
#
#   gh workflow run cloud-test.yml --ref <branch> -f script=<name> -f shards=<1 to 8>
#   gh run list --workflow cloud-test.yml --limit 1, then gh run view <id>
#
# The allowlist is read from the default branch, or on a pull request from its merge commit; a `ref` input tests
# another commit with that allowlist. A pull request that changes this file or the allowlist runs the default
# script once, which proves the wiring; the path filter keeps every other pull request from spending minutes.
# Pin the shared workflow to a full commit SHA of Colorado-Startups/.github main, never a branch.
#
# In this repo the allowlist holds the gate self-tests (gate-selftests.yml), the atlas parity check
# (marker-parity.yml), the comparison map geometry check (comparison-map-verify.yml) and the deliverable renders
# (03_deliverables/infographics/BUILD.md). A render's outputs come back as an artifact: gh run download <id>.
on:
  pull_request:
    paths:
      - .github/workflows/cloud-test.yml
      - .github/cloud-test.json
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to test. Empty tests the branch you dispatch from
        required: false
        default: ""
        type: string
      script:
        description: A name from .github/cloud-test.json
        required: true
        type: string
      shards:
        description: Parallel shards, 1 to 8. A script with no shard entry runs as one job
        required: false
        default: "1"
        type: string

permissions:
  contents: read

# A pull request's newer push cancels its older run. Each dispatch gets a group of its own, so two sessions
# testing different refs never cancel each other.
concurrency:
  group: cloud-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cloud-test:
    uses: Colorado-Startups/.github/.github/workflows/cloud-test.yml@9bb5e6d4830903adb552b5ad894c78f57570aa23 # .github PR #4 reviewed head; bump to main after merge
    with:
      ref: ${{ inputs.ref }}
      script: ${{ inputs.script || 'selftests' }}
      shards: ${{ inputs.shards || '1' }}
      # 3.11 matches gate-selftests.yml and comparison-map-verify.yml. pip installs requirements.txt only for the
      # entries that list it: the geometry check and the three renders that need matplotlib or reportlab.
      python: "3.11"
